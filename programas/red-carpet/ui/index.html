<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Carpet</title>
<link rel="stylesheet" href="/ui/panel.css">
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>

<div class="app" id="app" hidden>
  <aside>
    <div class="brand"><div class="logo">🎬</div><div><b>RED CARPET</b><small id="ver"></small></div></div>
    <nav id="nav">
      <button data-v="live" class="on"><span class="ic">📡</span><span data-i18n="tabLive"></span></button>
      <button data-v="gifts"><span class="ic">🎁</span><span data-i18n="tabGifts"></span></button>
      <button data-v="overlays"><span class="ic">🖼️</span><span data-i18n="tabOverlays"></span></button>
      <button data-v="game"><span class="ic">🎮</span><span data-i18n="tabGame"></span></button>
      <button data-v="admin" id="navAdmin" hidden><span class="ic">🛡️</span><span data-i18n="tabAdmin"></span></button>
    </nav>
    <div class="user" hidden><div class="av" id="uAv"></div><div><div class="nm" id="uName"></div><span class="badge" id="uPlan"></span></div></div>
    <select id="langSel"><option value="es">Español</option><option value="en">English</option></select>
  </aside>

  <main id="main">
    <!-- DIRECTO -->
    <section class="view" id="v-live">
      <h1><em>Red Carpet</em> · <span data-i18n="tabLive"></span></h1>
      <p class="sub" data-i18n="liveSub"></p>
      <div class="grid g2">
        <div class="card" id="liveCard">
          <h3><span class="ic">🎵</span><span data-i18n="tiktokUser"></span> <span class="eq" style="margin-left:auto"><i></i><i></i><i></i><i></i><i></i></span></h3>
          <div class="row"><input id="tt" placeholder="@tuusuario" style="flex:1" autocomplete="off" spellcheck="false">
            <button class="btn btn-primary jelly" id="connect"></button></div>
          <div class="err" id="ttErr"></div>
          <div class="row" style="margin-top:6px">
            <span class="pill"><span class="dot" id="dTT"></span><span id="sTT"></span></span>
            <span class="pill"><span class="dot" id="dG"></span><span id="sG"></span></span>
          </div>
          <div class="row" style="margin-top:16px">
            <div class="stat"><b id="nQ">0</b><span data-i18n="inQueue"></span></div>
            <div class="stat"><b id="nAv">0</b><span data-i18n="avatars"></span></div>
            <div class="stat"><b id="nGift">0</b><span data-i18n="gifts"></span></div>
          </div>
        </div>
        <div class="card">
          <h3><span class="ic">🧪</span><span data-i18n="test"></span></h3>
          <p class="hint" data-i18n="testHint"></p>
          <div class="row"><input id="tName" placeholder="Builderman" style="flex:1" autocomplete="off" spellcheck="false">
            <button class="btn btn-ghost jelly" id="tGo" data-i18n="send"></button></div>
          <div class="row" style="margin-top:12px" id="tModes"></div>
          <div class="row" style="margin-top:8px"><button class="btn btn-ghost btn-sm jelly" id="tMany">👥 <span data-i18n="testMany"></span></button>
            <button class="btn btn-ghost btn-sm jelly" id="tJam" hidden>🚧 <span data-i18n="jamGo"></span></button></div>
          <div class="err" id="tErr"></div>
        </div>
        <div class="card"><h3><span class="ic">📱</span><span>Live Checker</span></h3>
          <p class="hint" data-i18n="phoneHint"></p>
          <div class="row"><b id="phCode" style="font-size:22px;letter-spacing:3px;user-select:all"></b>
            <span class="pill"><span class="dot" id="phDot"></span><span id="phState"></span></span></div>
          <div class="row" style="margin-top:8px"><button class="btn btn-green btn-sm jelly" id="phNew"></button>
            <button class="btn btn-ghost btn-sm jelly" id="phTest" data-i18n="phoneTest"></button>
            <button class="btn btn-ghost btn-sm jelly" id="phApk" data-i18n="phoneApk"></button></div>
          <div id="phAdmin" style="margin-top:14px">
            <h3 style="margin-top:4px"><span class="ic">🔁</span><span data-i18n="restartTitle"></span></h3>
            <p class="hint" data-i18n="restartHint"></p>
            <div class="row"><label class="row"><input type="checkbox" id="rsOn"><span data-i18n="restartOn"></span></label>
              <input id="rsAt" type="number" min="1" max="239" style="width:70px"><span class="hint">min</span></div>
            <label class="row"><input type="checkbox" id="rsWarn"><span data-i18n="restartWarn"></span></label>
            <label class="row"><input type="checkbox" id="rsGifts"><span data-i18n="restartGifts"></span></label>
            <label class="row"><input type="checkbox" id="rsCaptcha"><span data-i18n="restartCaptcha"></span></label>
            <div class="row" style="margin-top:8px"><button class="btn btn-danger btn-sm jelly" id="rsNow">🔁 <span data-i18n="restartNow"></span></button>
              <button class="btn btn-ghost btn-sm jelly" id="rsTry" data-i18n="restartTry"></button>
              <button class="btn btn-green btn-sm jelly" id="rsElev" hidden data-i18n="restartElev"></button></div>
            <p class="hint" id="rsMsg"></p></div>
        </div>
      </div>
      <div class="grid g2" style="margin-top:16px">
        <div class="card"><h3><span class="ic">🚶</span><span data-i18n="queueTitle"></span>
            <span class="hint" style="margin-left:auto" data-i18n="autoWalk"></span><button class="toggle" id="paused"></button></h3>
          <div class="hint" id="nowWalk"></div>
          <div class="feed" id="queue" style="max-height:260px"></div>
          <div class="row" style="margin-top:10px"><button class="btn btn-ghost btn-sm jelly" id="qClear" data-i18n="clearQueue"></button></div></div>
        <div class="card"><h3><span class="ic">📜</span><span data-i18n="activity"></span></h3><div class="feed" id="log"></div></div>
      </div>
    </section>

    <!-- REGALOS -->
    <section class="view" id="v-gifts" hidden>
      <h1><span data-i18n="tabGifts"></span></h1>
      <p class="sub" data-i18n="giftsSub"></p>
      <div class="card" id="modesCard"></div>
    </section>

    <!-- OVERLAYS -->
    <section class="view" id="v-overlays" hidden>
      <h1><span data-i18n="tabOverlays"></span></h1>
      <p class="sub" data-i18n="ovSub"></p>
      <div class="row"><div class="chips" id="ovViews"></div>
        <input id="ovUrl" readonly style="flex:1;min-width:260px"><button class="btn btn-primary btn-sm jelly" id="ovCopy" data-i18n="copy"></button></div>
      <div class="ovstage"><iframe id="ovFrame"></iframe></div>
      <p class="hint" data-i18n="ovDrag"></p>
      <div class="card" id="ovModesWrap" hidden><h3><span class="ic">🎁</span><span data-i18n="tabGifts"></span></h3><div id="ovModes"></div></div>
      <div class="card" id="ovEls"></div>
      <div class="row" style="margin-top:10px"><button class="btn btn-ghost btn-sm jelly" id="ovReset" data-i18n="reset"></button></div>
    </section>

    <!-- JUEGO -->
    <section class="view" id="v-game" hidden>
      <h1><span data-i18n="tabGame"></span></h1>
      <p class="sub" data-i18n="gameSub"></p>
      <div class="grid g2">
        <div class="card">
          <h3><span class="ic">🔗</span><span data-i18n="linkTitle"></span></h3>
          <div class="seg" id="seg"><span class="pillbg"></span><button data-l="auto" data-i18n="linkAuto"></button><button data-l="code" data-i18n="linkCode"></button></div>
          <div id="lAuto">
            <p class="hint" data-i18n="autoHint"></p>
            <div class="row"><input id="rbx" placeholder="RobloxUser" style="flex:1" autocomplete="off" spellcheck="false">
              <button class="btn btn-primary btn-sm jelly" id="rbxSave" data-i18n="save"></button></div>
          </div>
          <div id="lCode" hidden>
            <p class="hint" data-i18n="codeHint"></p>
            <div class="row"><input id="code" class="code" maxlength="6" placeholder="ABC123" style="flex:1" autocomplete="off" spellcheck="false">
              <button class="btn btn-primary btn-sm jelly" id="codeSave" data-i18n="save"></button></div>
          </div>
          <div style="margin-top:12px"><p class="hint" data-i18n="keyHint"></p>
            <div class="row"><input id="ckey" type="password" data-i18n-ph="keyPh" style="flex:1" autocomplete="off" spellcheck="false">
              <button class="btn btn-primary btn-sm jelly" id="ckeySave" data-i18n="save"></button></div></div>
          <div class="err" id="lErr2"></div>
          <div class="row" style="margin-top:10px"><span class="pill"><span class="dot" id="dC"></span><span id="sC"></span></span></div>
          <div style="margin-top:14px"><button class="btn btn-green jelly" id="openGame">▶ <span data-i18n="openGame"></span></button></div>
        </div>
        <div class="card">
          <h3><span class="ic">🕹️</span><span data-i18n="afkTitle"></span><button class="toggle" id="afk" style="margin-left:auto"></button></h3>
          <p class="hint" data-i18n="afkHint"></p>
          <div class="set"><span data-i18n="afkEvery"></span><span><input id="afkMin" type="number" min="1" max="18" style="width:80px"> min</span></div>
          <div class="row"><button class="btn btn-ghost btn-sm jelly" id="afkTest" data-i18n="afkTest"></button><span class="hint" id="afkMsg"></span></div>
        </div>
        <div class="card">
          <h3><span class="ic">⏱️</span><span data-i18n="showTitle"></span></h3>
          <div class="set"><span data-i18n="walkGap"></span><span><input id="walkGap" type="number" min="1" max="60" step="0.5" style="width:80px"> s</span></div>
          <div class="set"><span data-i18n="cineGap"></span><span><input id="cineGap" type="number" min="3" max="120" style="width:80px"> s</span></div>
          <div class="set"><span data-i18n="fastOn"></span><span><input id="fastOn" type="number" min="10" max="5000" style="width:80px"></span></div>
          <div class="set"><span data-i18n="fastOff"></span><span><input id="fastOff" type="number" min="0" max="5000" style="width:80px"></span></div>
          <div class="set"><span data-i18n="fastX"></span><span>×<input id="fastX" type="number" min="1" max="3" step="0.1" style="width:70px"></span></div>
          <div class="set"><span data-i18n="screenWalker"></span><button class="toggle" id="scrWalker"></button></div>
          <div class="row" style="margin-top:8px"><input id="stText" data-i18n-ph="screenText" maxlength="24" style="flex:1"><input type="color" id="stColor" value="#6ee196">
            <button class="btn btn-ghost btn-sm jelly" id="stGo" data-i18n="send"></button><button class="btn btn-ghost btn-sm jelly" id="stAuto">🌈</button></div>
          <div class="row" style="margin-top:8px"><span class="hint" data-i18n="stageStyle"></span><div class="chips" id="stStyles"></div></div>
          <div class="row" style="margin-top:8px"><span class="hint" data-i18n="stageFloor"></span><div class="chips" id="stFloors"></div></div>
          <div class="row" style="margin-top:8px"><span class="hint" data-i18n="stageBarrier"></span><div class="chips" id="stBarriers"></div></div>
        </div>
        <div class="card">
          <h3><span class="ic">⭐</span><span data-i18n="fameTitle"></span><button class="toggle" id="fameOn" style="margin-left:auto"></button></h3>
          <p class="hint" data-i18n="fameHint"></p>
          <div class="set"><span data-i18n="fameRate"></span><span><input id="fameRate" type="number" min="1" max="100000" style="width:90px"></span></div>
          <div id="fameTop" class="log" style="margin-top:8px"></div>
          <div class="row" style="margin-top:8px"><button class="btn btn-ghost btn-sm jelly" id="fameReset" data-i18n="fameReset"></button></div>
        </div>
        <div class="card">
          <h3><span class="ic">📋</span><span data-i18n="howTitle"></span></h3>
          <ol class="steps"><li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li><li data-i18n="how4"></li></ol>
          <p class="hint" style="margin-top:12px" data-i18n="studioHint"></p>
        </div>
      </div>
    </section>

    <!-- CUENTA -->
    <section class="view" id="v-account" hidden>
      <h1><span data-i18n="tabAccount"></span></h1>
      <p class="sub" id="accSub"></p>
      <div class="grid g2">
        <div class="card" id="accCard"></div>
        <div class="card"><h3><span class="ic">💬</span>Discord</h3><p class="hint" data-i18n="discordHint"></p>
          <button class="btn btn-ghost btn-sm jelly" id="openDiscord">Discord</button></div>
      </div>
    </section>

    <!-- ADMIN -->
    <section class="view" id="v-admin" hidden>
      <h1>🛡️ <span data-i18n="tabAdmin"></span></h1>
      <p class="sub">Wylo</p>
      <div class="grid g2">
        <div class="card"><h3><span class="ic">🎁</span><span data-i18n="grantTitle"></span></h3>
          <p class="hint" data-i18n="grantHint"></p>
          <div class="row"><input id="adGU" data-i18n-ph="username" style="flex:1"><input id="adGM" type="number" min="0" value="30" style="width:90px"><span class="hint">min</span>
            <button class="btn btn-green btn-sm jelly" id="adGrant" data-i18n="grant"></button></div>
          <p class="hint" id="adGrantMsg"></p></div>
        <div class="card"><h3><span class="ic">⏱️</span><span data-i18n="trialTitle"></span></h3>
          <div class="row"><input id="adTU" data-i18n-ph="username" style="flex:1"><input id="adTP" data-i18n-ph="password" style="flex:1">
            <input id="adTM" type="number" min="1" value="30" style="width:80px"><button class="btn btn-green btn-sm jelly" id="adTrial" data-i18n="create"></button></div>
          <p class="hint" id="adTrialMsg" data-i18n="trialHint"></p></div>
        <div class="card"><h3><span class="ic">🌐</span><span data-i18n="siteTitle"></span></h3>
          <p class="hint" data-i18n="siteHint"></p>
          <div class="row"><input id="adSite" placeholder="coreus-games.pages.dev" maxlength="40" style="flex:1">
            <button class="btn btn-green btn-sm jelly" id="adSiteGo" data-i18n="send"></button></div></div>
        <div class="card"><h3><span class="ic">🤖</span><span data-i18n="autoTitle"></span></h3>
          <p class="hint" data-i18n="autoHint"></p>
          <label class="row"><input type="checkbox" id="adAuto"><span data-i18n="autoOn"></span></label>
          <div class="row"><input id="adRacha" type="number" min="1" max="8" value="3" style="width:70px">
            <button class="btn btn-green btn-sm jelly" data-auto="racha" data-i18n="autoRacha"></button>
            <button class="btn btn-sm jelly" data-auto="giant" data-i18n="autoGiant"></button>
            <button class="btn btn-sm jelly" data-auto="party" data-i18n="autoParty"></button></div>
          <p class="hint" id="adAutoMsg"></p><p class="hint" id="adAutoStats"></p></div>
        <div class="card"><h3><span class="ic">🚧</span><span data-i18n="jamTitle"></span></h3>
          <p class="hint" data-i18n="jamHint"></p>
          <div class="row"><label class="row"><input type="checkbox" id="jamAuto"><span data-i18n="jamAuto"></span></label>
            <input id="jamEvery" type="number" min="1" max="240" style="width:70px"><span class="hint">min</span>
            <button class="btn btn-green btn-sm jelly" id="jamGo2">🚧 <span data-i18n="jamGo"></span></button></div>
          <div class="nb" id="jamList"></div>
          <div class="row" style="margin-top:8px"><button class="btn btn-ghost btn-sm jelly" id="jamAdd">＋ <span data-i18n="jamAdd"></span></button>
            <span class="hint">👥 <b id="jamCount">0</b> · <span data-i18n="jamPaste"></span></span><span class="hint" id="jamMsg"></span></div></div>
      </div>
    </section>
  </main>
</div>

<!-- primer arranque: idioma -->
<div class="screen" id="sLang" hidden><div class="box">
  <h2>🌍 Idioma · Language</h2><p class="lead">Red Carpet</p>
  <div class="row" style="justify-content:center"><button class="btn btn-primary jelly" data-lang="es">Español</button><button class="btn btn-primary jelly" data-lang="en">English</button></div>
</div></div>

<!-- inicio de sesión / registro -->
<div class="screen" id="sLogin" hidden><div class="box">
  <div class="brand" style="justify-content:center;margin-bottom:14px"><div class="logo">🎬</div><div><b>RED CARPET</b></div></div>
  <h2 data-i18n="welcome"></h2><p class="lead" data-i18n="welcomeSub"></p>
  <div class="tabs2"><button class="on" data-mode="login" data-i18n="login"></button><button data-mode="register" data-i18n="register"></button></div>
  <div class="form">
    <input id="lUser" data-i18n-ph="username" autocomplete="username">
    <input id="lPass" type="password" data-i18n-ph="password" autocomplete="current-password">
    <input id="lConf" type="password" data-i18n-ph="confirm" hidden>
    <div class="err" id="lErr"></div>
    <button class="btn btn-primary btn-lg jelly" id="lGo" data-i18n="login"></button>
  </div>
</div></div>

<!-- planes -->
<div class="screen" id="sPlans" hidden><div class="box">
  <h2 data-i18n="plansTitle"></h2><p class="lead" data-i18n="plansSub"></p>
  <p class="banner-ended" id="pEnded" data-i18n="trialEndedMsg" hidden></p>
  <div class="plan best">
    <b id="pName"></b><div class="price" id="pPrice"></div><span class="counter" id="pLeft"></span>
    <ul><li>👗 <span data-i18n="feat1"></span></li><li>🌹 <span data-i18n="feat2"></span></li><li>🖼️ <span data-i18n="feat3"></span></li><li>🔄 <span data-i18n="feat4"></span></li></ul>
    <button class="btn btn-primary btn-lg jelly" id="pBuy" data-i18n="buy"></button>
  </div>
  <div class="row" style="justify-content:center;margin-top:18px">
    <button class="btn btn-green jelly" id="pCheck" data-i18n="paid"></button>
    <button class="btn btn-ghost jelly" id="pTrial">🎁 <span data-i18n="requestTrial"></span></button>
    <button class="btn btn-ghost btn-sm jelly" id="pBack" data-i18n="backToPanel" hidden></button>
    <button class="btn btn-ghost btn-sm jelly" id="pLogout" data-i18n="logout"></button>
  </div>
  <p class="err" id="pErr" style="text-align:center"></p>
</div></div>

<!-- actualización -->
<div class="screen" id="sUpdate" hidden><div class="box">
  <h2>✨ <span data-i18n="newVersion"></span></h2><p class="lead" id="upVer"></p>
  <div class="card" style="max-height:240px;overflow:auto;white-space:pre-wrap;font-size:13px" id="upNotes"></div>
  <div id="upBar" hidden style="height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:14px"><i style="display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#25f4ee,#fe2c55);transition:width .3s"></i></div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-primary jelly" id="upGo" data-i18n="update"></button><button class="btn btn-ghost jelly" id="upLater" data-i18n="later"></button></div>
  <p class="hint" id="upMsg" style="text-align:center"></p>
</div></div>

<!-- elegir regalo -->
<div class="modal" id="giftModal"><div class="sheet">
  <div class="row"><b style="flex:1" data-i18n="pickGift"></b><input id="gSearch" data-i18n-ph="search" style="flex:1"><button class="btn btn-ghost btn-sm" id="gClose">✕</button></div>
  <div class="gifts" id="gList"></div>
</div></div>

<script src="/ui/i18n.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
